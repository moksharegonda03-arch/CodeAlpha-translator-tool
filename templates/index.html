<!DOCTYPE html>
<html>
<head>
    <title>Language Translator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: blue;
            color: white;
            border: none;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>
<body>

    <h1>🌍 Language Translator</h1>

    <form method="POST">
        <input type="text" name="text" placeholder="Enter text here" required>
        <br>
        <button type="submit">Translate</button>
    </form>

    <div class="result">
        {{ translated_text }}
    </div>

</body>
</html>
